<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title · $app_name</title>
  <link rel="stylesheet" href="/auth/login.css">
</head>
<body>
  <header class="login-header">
    <h1>$app_name</h1>
    <span>$version</span>
  </header>
  <main>
    <section class="login-card" aria-labelledby="form-title">
      <h2 id="form-title">$title</h2>
      $notice
      <form action="$action" method="post">
        <label for="username">账号</label>
        <input id="username" name="username" type="text" placeholder="请输入账号" value="$username"
               autocomplete="username" maxlength="32" required>
        <label for="password">密码</label>
        <input id="password" name="password" type="password" placeholder="请输入密码"
               autocomplete="$password_autocomplete" minlength="6" maxlength="128" required>
        $confirmation
        <button class="primary-button" type="submit">$submit</button>
      </form>
      <p class="switch-form">$switch</p>
    </section>
  </main>
</body>
</html>

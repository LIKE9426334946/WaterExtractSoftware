app:
  name: 遥感影像水体智能提取系统
  english_name: Remote Sensing Water Extraction System
  version: V1.0

server:
  host: 127.0.0.1
  port: 7860

inference:
  # 使用下方 model 结构与 training 的归一化参数加载训练得到的 state_dict。
  checkpoint: weights/best.pth
  device: cuda
  amp: true
  tile_size: 384
  tile_overlap: 64
  threshold: 0.5

visualization:
  alpha: 0.5
  water_color: "#2563EB"
  show_boundary: false

files:
  # 相对路径以本配置文件所在目录为基准。
  output_dir: outputs
  max_upload_mb: 20
  max_pixels: 16000000

# CAID 官方压缩包（Zenodo v2）采用 VOC 目录结构；JPEGImages 内实际为 PNG。
# root 指向直接包含 JPEGImages、SegmentationClass、ImageSets 的目录。
dataset:
  root: data/CAID/CAID
  train_images: JPEGImages
  train_masks: SegmentationClass
  val_images: JPEGImages
  val_masks: SegmentationClass
  train_split: ImageSets/Segmentation/train.txt
  val_split: ImageSets/Segmentation/val.txt
  image_suffix: .png
  mask_suffix: .png

model:
  # models/model_using.py 中的 UNetPPDeepLabV3Plus；训练时随机初始化，应用加载权重。
  in_channels: 3
  out_channels: 1
  base_channels: 32
  aspp_channels: 256
  decoder_channels: 128
  aspp_rates: [6, 12, 18]

training:
  image_size: 384
  # RGB 先除以 255，再按此均值和标准差归一化；不依赖预训练编码器。
  image_mean: [0.485, 0.456, 0.406]
  image_std: [0.229, 0.224, 0.225]
  scale_range: [0.75, 1.25]
  horizontal_flip_prob: 0.5
  vertical_flip_prob: 0.5
  batch_size: 8
  # 验证保留完整图像；batch_size=1 也可以处理不同尺寸的影像。
  val_batch_size: 1
  epochs: 100
  learning_rate: 0.0001
  weight_decay: 0.0001
  num_workers: 0
  seed: 42
  device: cuda
  amp: true
  optimizer: AdamW
  # BCEWithLogitsLoss 对应 SMP SoftBCEWithLogitsLoss（不启用标签平滑）。
  # 也可设置为 DiceLoss。
  loss: BCEWithLogitsLoss
  metric_threshold: 0.5
  save_dir: weights
  output_dir: outputs/train
